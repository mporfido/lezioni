<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Slide</title>
    <meta name="theme-color" content="#FBFBF6">
    <link rel="preload" href="../veste/fonts/space-grotesk-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="../veste/fonts/ibm-plex-serif-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="../veste/sito.css">
    <link rel="stylesheet" href="../veste/tema.css">
    <script defer src="../veste/lib/marked.umd.js"></script>
    <script defer src="../veste/comune.js"></script>
    <script defer src="../veste/slides.js"></script>
</head>
<body class="slide">
    <div class="mazzo">
        <main class="slide-corrente"></main>
        <nav class="barra">
            <button class="indietro" type="button" aria-label="Slide precedente">←</button>
            <span class="titolo-mazzo"></span>
            <span class="contatore"></span>
            <button class="avanti" type="button" aria-label="Slide successiva">→</button>
        </nav>
    </div>
</body>
</html>
